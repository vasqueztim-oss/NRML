[project]
name = "nrml"
version = "0.1.0"
description = "A news-first AI newsroom for everyday people"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.15.0",
    "pydantic>=2",
]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["nrml"]
